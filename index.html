<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Интерактивный Сайт</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --vx: calc(min(100vw, 100vh * 16 / 9) / 800);
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            background-size: contain;
            background-position: center top;
            background-repeat: no-repeat;
            background-color: #f7f7f7;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        @keyframes flyIn { 
            to { opacity: 1; transform: translate(0, 0) scale(1); } 
        }

        @keyframes flyInMobile {
            from { opacity: 0; transform: translateY(100px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .btn-back {
            position: absolute;
            bottom: calc(12.5 * var(--vx));
            right: calc(12.5 * var(--vx));
            padding: calc(5 * var(--vx)) calc(12 * var(--vx));
            background-color: #ffffff;
            color: #5a738e;
            font-size: calc(7 * var(--vx));
            font-weight: 600;
            letter-spacing: calc(0.25 * var(--vx));
            border: calc(0.5 * var(--vx)) solid #e2e8f0; 
            border-radius: calc(3 * var(--vx));
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 calc(1 * var(--vx)) calc(4 * var(--vx)) rgba(0, 0, 0, 0.05);
            transform: translateX(-80%);
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }
        .btn-back:hover {
            background-color: #5a738e;
            color: #ffffff;
            transform: translateX(-80%) translateY(-1px); 
        }

        .main-btn-container, .gallery-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(800 * var(--vx));
            height: calc(450 * var(--vx));
            pointer-events: auto; 
        }

        .invisible-btn {
            position: absolute;
            width: calc(20 * var(--vx)); 
            height: calc(20 * var(--vx)); 
            cursor: pointer;
            z-index: 9999;
            background: transparent;
            border: none;
            outline: none;
            transition: transform 0.2s ease;
        }
        .invisible-btn:hover { 
            transform: scale(1.1); 
        }

        #btn-human { 
            top: calc(250.5 * var(--vx)); 
            left: calc(264.5 * var(--vx)); 
        }
        #btn-messenger { 
            top: calc(250.5 * var(--vx)); 
            left: calc(286.5 * var(--vx)); 
        }

        .thumb-btn {
            position: absolute;
            width: calc(182.5 * var(--vx)); 
            height: calc(101.5 * var(--vx)); 
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: calc(3 * var(--vx));
            box-shadow: 0 calc(2 * var(--vx)) calc(6 * var(--vx)) rgba(0,0,0,0.15);
            opacity: 0;
            transform: translate(-100vw, -100vh) scale(0);
        }

        .screen.active .thumb-btn {
            animation: flyIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }
        
        .screen.active .thumb-btn:nth-child(1) { animation-delay: 0.1s; }
        .screen.active .thumb-btn:nth-child(2) { animation-delay: 0.25s; }
        .screen.active .thumb-btn:nth-child(3) { animation-delay: 0.4s; }
        .screen.active .thumb-btn:nth-child(4) { animation-delay: 0.55s; }
        .screen.active .thumb-btn:nth-child(5) { animation-delay: 0.7s; }
        .screen.active .thumb-btn:nth-child(6) { animation-delay: 0.85s; }

        .thumb-btn:hover {
            transform: scale(1.05) !important;
            outline: calc(1 * var(--vx)) solid #0066ff;
            z-index: 5;
            transition: transform 0.2s ease, outline 0.2s ease;
        }

        #thumb1 { top: calc(85 * var(--vx)); left: calc(90 * var(--vx)); }
        #thumb2 { top: calc(85 * var(--vx)); left: calc(308.5 * var(--vx)); }
        #thumb3 { top: calc(85 * var(--vx)); left: calc(527 * var(--vx)); }
        
        #thumb4 { top: calc(260 * var(--vx)); left: calc(90 * var(--vx)); }
        #thumb5 { top: calc(260 * var(--vx)); left: calc(308.5 * var(--vx)); }
        #thumb6 { top: calc(260 * var(--vx)); left: calc(527 * var(--vx)); }

        @media (orientation: portrait) {
            .screen {
                position: relative !important;
                height: auto !important;
                min-height: 100vh !important;
                background-size: cover !important; 
                background-position: center center !important;
                padding: 0 !important;
            }

            #screen-main { background-image: url('main-mobile.jpg') !important; }
            #screen-menu1 { background-image: url('menu1-mobile.jpg') !important; }
            #screen-menu2 { background-image: url('menu2-mobile.jpg') !important; }

            .main-btn-container {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                transform: none !important;
                width: 100% !important;
                height: 100vh !important;
                display: block !important;
            }

            .invisible-btn {
                position: absolute !important;
                width: 50px !important; 
                height: 50px !important;
                background: transparent !important;
                border: none !important;
                outline: none !important;
            }

            #btn-human { top: 33.5% !important; left: 30% !important; }
            #btn-messenger { top: 42.3% !important; left: 67.5% !important; }

            .gallery-container {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                width: 100% !important;
                height: auto !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: flex-start !important;
                gap: 25px !important;
                padding: 60px 30px 110px 30px !important;
            }

            .thumb-btn {
                position: relative !important;
                top: auto !important; 
                left: auto !important; 
                width: 90% !important;
                height: auto !important; 
                aspect-ratio: 365 / 203 !important;
                margin: 0 auto !important;
                opacity: 0;
                transform: translateY(100px) scale(0.9);
            }

            .screen.active .thumb-btn {
                animation: flyInMobile 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards !important;
            }

            .btn-back {
                position: fixed !important;
                bottom: 20px !important;
                left: 50% !important;
                right: auto !important;
                transform: translateX(-50%) !important;
                width: 80% !important;
                max-width: 200px !important;
                height: 44px !important;
                padding: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 15px !important;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important;
                z-index: 99999 !important;
            }
        }
    </style>
</head>
<body>

    <div id="screen-main" class="screen active" style="background-image: url('main.jpg');">
        <div class="main-btn-container">
            <div id="btn-human" class="invisible-btn" onclick="goToScreen('screen-menu1')" title="Галерея"></div>
            <div id="btn-messenger" class="invisible-btn" onclick="goToScreen('screen-menu2')" title="Контакты"></div>
        </div>
    </div>

    <div id="screen-menu1" class="screen" style="background-image: url('menu1.jpg');">
        <div class="gallery-container">
            <div id="thumb1" class="thumb-btn" style="background-image: url('page1.jpg');" onclick="goToScreen('screen-p1')"></div>
            <div id="thumb2" class="thumb-btn" style="background-image: url('page2.jpg');" onclick="goToScreen('screen-p2')"></div>
            <div id="thumb3" class="thumb-btn" style="background-image: url('page3.jpg');" onclick="goToScreen('screen-p3')"></div>
            <div id="thumb4" class="thumb-btn" style="background-image: url('page4.jpg');" onclick="goToScreen('screen-p4')"></div>
            <div id="thumb5" class="thumb-btn" style="background-image: url('page5.jpg');" onclick="goToScreen('screen-p5')"></div>
            <div id="thumb6" class="thumb-btn" style="background-image: url('page6.jpg');" onclick="goToScreen('screen-p6')"></div>
        </div>
        <button class="btn-back" onclick="goToScreen('screen-main')">Вернуться</button>
    </div>

    <div id="screen-menu2" class="screen" style="background-image: url('menu2.jpg');">
        <button class="btn-back" onclick="goToScreen('screen-main')">Вернуться</button>
    </div>

    <div id="screen-p1" class="screen" style="background-image: url('page1.jpg');"><button class="btn-back" onclick="goToScreen('screen-menu1')">Вернуться</button></div>
    <div id="screen-p2" class="screen" style="background-image: url('page2.jpg');"><button class="btn-back" onclick="goToScreen('screen-menu1')">Вернуться</button></div>
    <div id="screen-p3" class="screen" style="background-image: url('page3.jpg');"><button class="btn-back" onclick="goToScreen('screen-menu1')">Вернуться</button></div>
    <div id="screen-p4" class="screen" style="background-image: url('page4.jpg');"><button class="btn-back" onclick="goToScreen('screen-menu1')">Вернуться</button></div>
    <div id="screen-p5" class="screen" style="background-image: url('page5.jpg');"><button class="btn-back" onclick="goToScreen('screen-menu1')">Вернуться</button></div>
    <div id="screen-p6" class="screen" style="background-image: url('page6.jpg');"><button class="btn-back" onclick="goToScreen('screen-menu1')">Вернуться</button></div>

    <script>
        function goToScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));
            
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            }
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
